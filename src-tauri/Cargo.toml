[package]
name = "tingyi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "聽譯:即時系統音訊辨識與繁中字幕翻譯"

[lib]
# `_lib` 後綴避免 Windows 上與 bin 同名衝突(cargo#8519)。
name = "tingyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tingyi-core = { path = "../crates/tingyi-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-dialog = "2"
# 自動更新(簽章驗證、下載、NSIS 安裝)。不用預設的 rustls-tls:它開 reqwest 的 rustls-no-provider,
# 功能合併後 tingyi-core 的翻譯 HTTP client 建立時會 panic(沒有 crypto provider);改用 native-tls
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
