<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-translator 本機翻譯</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">譯</div>
        <div>
          <h1>agent-translator 本機翻譯</h1>
          <p class="sub">在你的電腦上執行翻譯模型,瀏覽器擴充會自動連上。</p>
        </div>
      </header>

      <section class="card" id="model-card">
        <div class="row">
          <h2>本地翻譯模型</h2>
          <span class="badge" id="model-badge">—</span>
        </div>
        <p class="hint" id="model-hint"></p>
        <div class="progress" id="progress" hidden>
          <div class="bar"><div class="fill" id="progress-fill"></div></div>
          <span id="progress-text"></span>
        </div>
        <div class="actions">
          <button id="btn-download" class="primary" hidden>下載並啟動(約 1.9 GB)</button>
          <button id="btn-cancel" hidden>暫停下載</button>
          <button id="btn-start" class="primary" hidden>啟動</button>
          <button id="btn-stop" hidden>停止</button>
          <button id="btn-logs" class="link">開啟記錄資料夾</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <h2>瀏覽器擴充</h2>
          <span class="badge" id="link-badge">—</span>
        </div>
        <ul class="checks" id="browsers"></ul>
        <p class="hint" id="link-hint"></p>
      </section>

      <section class="card">
        <div class="row">
          <h2>CLI agent(進階)</h2>
          <label class="switch"><input type="checkbox" id="bridge-toggle" /><span></span></label>
        </div>
        <p class="hint" id="bridge-hint">讓已安裝 codex 等命令列 AI 工具的人,也能用它們翻譯。需要 Node.js。</p>
      </section>

      <section class="card">
        <div class="row">
          <h2>開機時自動在背景啟動</h2>
          <label class="switch"><input type="checkbox" id="autostart-toggle" /><span></span></label>
        </div>
        <p class="hint">關閉視窗後程式會留在右下角系統匣,繼續提供翻譯。</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
