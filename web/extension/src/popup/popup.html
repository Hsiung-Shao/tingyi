<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Agent Translator</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body { width: 300px; padding: 14px; }
      #toggle { width: 100%; margin-top: 4px; }
      #appLink { display: flex; gap: 6px; align-items: center; margin: -4px 0 10px; }
      #appLink .status { margin: 0; flex: 1; }
      #appLinkAction { padding: 2px 8px; font-size: 12px; }
      #siteBox h2 { margin: 12px 0 2px; }
      label.check { display: flex; gap: 6px; align-items: center; margin: 4px 0; color: inherit; }
      .small { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Agent Translator</h1>
    <div id="appLink" hidden>
      <div id="appLinkText" class="status muted"></div>
      <button id="appLinkAction" class="secondary" hidden></button>
    </div>
    <button id="toggle">翻譯此頁</button>
    <div id="pageState" class="status muted"></div>
    <div id="siteBox" hidden>
      <h2>這個網站:<span id="siteHost"></span></h2>
      <label class="check"><input id="siteAuto" type="checkbox" /> 開啟時自動翻譯</label>
      <div id="ytBox" hidden>
        <label class="check"><input id="siteCaptions" type="checkbox" /> 翻譯影片字幕</label>
        <label class="check"><input id="siteListen" type="checkbox" /> 影片沒有字幕時用聽譯聽譯</label>
        <div class="muted small">YouTube 上「翻譯此頁」不含字幕,字幕只看「翻譯影片字幕」。沒有字幕的影片播放時,聽譯會聽瀏覽器的聲音,字幕顯示在播放器裡。</div>
      </div>
    </div>
    <div class="row seg" style="margin-top: 10px">
      <select id="displayMode" aria-label="顯示模式">
        <option value="dual">雙語對照</option>
        <option value="only">僅譯文</option>
      </select>
      <select id="scope" aria-label="翻譯範圍">
        <option value="main">主要內容</option>
        <option value="page">整頁</option>
      </select>
    </div>
    <label for="route">翻譯後端</label>
    <select id="route">
      <option value="bridge">bridge(MCP:訂閱 agent)</option>
      <option value="direct">直連 OpenAI 相容端點</option>
    </select>
    <div id="bridgeBox">
      <label for="provider">agent</label>
      <select id="provider"></select>
    </div>
    <label for="targetLang">目標語言</label>
    <select id="targetLang">
      <option value="zh-TW">繁體中文(台灣)</option>
      <option value="zh-CN">簡體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>
    <div id="providerState" class="status muted"></div>
    <p><a href="#" id="openOptions">進階設定</a></p>
    <script src="popup.js"></script>
  </body>
</html>
